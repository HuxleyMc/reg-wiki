[package]
name = "reg-wiki"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
globset = "0.4"
jiff = "0.2.40"
libc = "0.2"
pulldown-cmark = "0.13.6"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml_edit = "0.25.19"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

# Shipped binaries: smallest and fastest, at the cost of a slower build.
# No `panic = "abort"`: hooks rely on catch_unwind to never break the agent.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Faster CI and local test builds: keep line tables for backtraces, skip the rest.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
