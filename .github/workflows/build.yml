# Reusable: builds optimised release binaries for every supported target and
# uploads each as an artifact named reg-wiki-<target>.
name: build

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl = fully static, runs on any Linux distro.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build
        shell: bash
        run: |
          # rusqlite's bundled SQLite is C; compile it against musl too.
          if [[ "${{ matrix.target }}" == *musl ]]; then
            export CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc
          fi
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name=reg-wiki-${{ matrix.target }}
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf "dist/$name.tar.gz" reg-wiki
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        run: target/${{ matrix.target }}/release/reg-wiki --version
      - uses: actions/upload-artifact@v4
        with:
          name: reg-wiki-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
